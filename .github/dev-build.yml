name: Dev Build

# Builds the all-in-one image from `develop` and pushes it to this fork's GHCR, so a push here is
# immediately pullable for testing -- no version tag, no release. Single amd64 job on purpose: this is
# for testing on your own machine, not a multi-arch publish. See release.yml for that flow (native arm64
# runner, digest merge, attestations) if this ever needs to ship for real.
#
#   docker pull ghcr.io/tigamingtv/uchiyomi:develop            # always the latest push to develop
#   docker pull ghcr.io/tigamingtv/uchiyomi:sha-<short sha>    # pinned to one exact commit
#
# GHCR packages default to private. First pull may need `docker login ghcr.io`, or make the package
# public from its settings page on GitHub.
#
# ⚠️ THIS FILE LIVES ONLY ON `develop`, NEVER ON `main`. It exists to build test images for this fork
# and has no reason to exist upstream. Keeping it off `main` is what keeps it out of PRs to the real
# project: a branch cut from `main` (e.g. `git checkout -b fix/x main`) simply never has this file in its
# history, so it cannot show up in that PR's diff. Do not merge `develop` into `main`, and do not branch
# upstream-bound work from `develop` -- branch from `main` (or `upstream/main`) instead. If a branch ever
# does pick this file up by accident, `git rm .github/workflows/dev-build.yml` before opening the PR.

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

concurrency:
  # A second push to develop while one build is still running only needs the newer commit's image.
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push aio (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name and short sha
        id: meta
        run: |
          # GHCR requires a lowercase path; github.repository preserves the fork's actual casing.
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.aio
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.name }}:develop
            ${{ steps.meta.outputs.name }}:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Uchiyomi (dev build)
            org.opencontainers.image.description=Development build from develop -- not a release, do not use in production
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MPL-2.0

      - name: How to pull it
        run: echo "::notice::docker pull ${{ steps.meta.outputs.name }}:develop"
